name: Tempo reminder check

on:
  schedule:
    # GitHub Actions supports frequent schedules, but delivery is still best-effort.
    # Keep Vercel Hobby deploys safe by NOT using Vercel Cron for 5-minute reminders.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  call-reminder-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Tempo reminders
        run: |
          curl -fsS -X POST "${{ secrets.TEMPO_APP_URL }}/api/push/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

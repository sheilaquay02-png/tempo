name: Tempo CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Locate Tempo app root
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
            echo "Tempo app root: ."
          elif [ -f tempo/package.json ]; then
            echo "APP_DIR=tempo" >> "$GITHUB_ENV"
            echo "Tempo app root: tempo"
          else
            echo "::error::Could not find package.json at repo root or tempo/package.json. Place the Tempo app files at the repo root, or keep them inside a tempo/ folder."
            exit 1
          fi

      - name: Show runtime versions
        shell: bash
        run: |
          node --version
          npm --version

      - name: Validate release safety before install
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          node scripts/validate-release.mjs

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          npm ci --no-audit --no-fund

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          npm test

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          npm run lint

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          npm run build
